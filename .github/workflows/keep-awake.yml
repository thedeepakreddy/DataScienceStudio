name: Keep awake

# Render's free tier sleeps a web service after 15 minutes without traffic.
# The studio pings itself while it runs; this is the outside backup that also
# wakes it if it ever falls asleep. Set the repository variable KEEP_AWAKE_URLS
# (Settings → Secrets and variables → Actions → Variables) to one or more
# space- or comma-separated addresses, e.g. https://your-studio.onrender.com/healthz
#
# Don't list a Cloud Run address here: Cloud Run starts in seconds, and a ping every
# 10 minutes would keep an instance running (and billed) all month.
#
# GitHub may delay scheduled runs, and pauses them after 60 days without
# repository activity; re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          URLS: ${{ vars.KEEP_AWAKE_URLS }}
        run: |
          if [ -z "$URLS" ]; then
            echo "::warning::Set the KEEP_AWAKE_URLS repository variable to the site's address."
            exit 0
          fi
          for url in $(echo "$URLS" | tr ',' ' '); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 10 "$url" || echo 000)
            echo "$url -> $code"
          done
